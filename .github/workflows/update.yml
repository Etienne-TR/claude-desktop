# Toutes les heures : nouvelle version publiée par Anthropic ? scripts/update.sh
# la vérifie (signature PGP) et l'écrit dans sources.json ; elle n'est
# committée qu'après avoir été construite.
name: Mise à jour

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Vérifier la dernière version d'Anthropic
        run: nix develop --command ./scripts/update.sh
      - name: Construire et committer si elle a changé
        run: |
          git diff --quiet -- sources.json && exit 0
          nix build --print-build-logs .#default
          version=$(jq -r .version sources.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "claude-desktop $version" -- sources.json
          git push
